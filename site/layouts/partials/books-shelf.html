{{/* Полка книг: единый вид для главной /books/ и страниц таксономий.
     Контекст (.) — коллекция страниц-книг. */}}
<div class="shelf-grid">
  {{ range . }}
    {{ $title := .Title }}
    <figure class="shelf-book" title="{{ .Title }}{{ with .Params.author }} — {{ . }}{{ end }}">
      {{ $status := .Params.status }}
      <span class="shelf-book__status shelf-book__status--{{ $status | default "none" }}">
        {{ if eq $status "reading" }}{{ partial "iconify" (dict "icon" "material-symbols:menu-book-outline-rounded") }}
        {{ else if eq $status "readed" }}{{ partial "iconify" (dict "icon" "ion:checkmark-done-outline") }}
        {{ else if eq $status "future" }}{{ partial "iconify" (dict "icon" "wi:time-4") }}{{ end }}
      </span>
      {{ with .Params.cover }}
        {{/* Локальные растровые обложки (скачаны sync_public_notes.py в
             static/images/covers) прогоняем через Hugo: WebP ~320px q80 на
             полку, а полный оригинал отдаём в зум через data-zoom-src.
             Внешние URL и прочее — как есть, с фолбэком на плейсхолдер. */}}
        {{ $cover := . }}
        {{ $ext := lower (strings.TrimPrefix "." (path.Ext $cover)) }}
        {{ $isLocal := and (hasPrefix $cover "/") (not (hasPrefix $cover "//")) }}
        {{ $raster := in (slice "png" "jpg" "jpeg" "webp") $ext }}
        {{ $res := "" }}
        {{ if and $isLocal $raster }}
          {{ $p := strings.TrimPrefix "/" $cover }}
          {{ with (resources.Get $p) }}{{ $res = . }}
          {{ else }}{{ with (resources.Get (replace $p "%20" " ")) }}{{ $res = . }}{{ end }}{{ end }}
        {{ end }}
        {{/* try: битая/неподдерживаемая обложка не должна валить всю сборку —
             на ошибке ресайза откатываемся на исходник с плейсхолдером. */}}
        {{ $thumb := "" }}
        {{ if $res }}{{ with try ($res.Resize "320x webp q80") }}
          {{ if .Err }}{{ warnf "cover resize failed for %s: %s" $cover .Err }}{{ else }}{{ $thumb = .Value }}{{ end }}
        {{ end }}{{ end }}
        {{ if $thumb }}
          <img class="shelf-book__cover" src="{{ $thumb.RelPermalink }}"
               width="{{ $thumb.Width }}" height="{{ $thumb.Height }}"
               data-zoom-src="{{ $cover }}" alt="{{ $title }}" loading="lazy" decoding="async" />
        {{ else }}
          <img class="shelf-book__cover" src="{{ $cover }}" alt="{{ $title }}" loading="lazy"
               onerror="this.onerror=null;this.src='/assets/book-cover.png';this.alt='Обложка недоступна'" />
        {{ end }}
      {{ else }}
        <div class="shelf-book__cover shelf-book__cover--empty"><span>{{ .Title }}</span></div>
      {{ end }}
      <figcaption class="shelf-book__meta">
        <span class="shelf-book__title">{{ .Title }}</span>
        {{ with .Params.author }}<span class="shelf-book__author">{{ . }}</span>{{ end }}
      </figcaption>
    </figure>
  {{ end }}
</div>
