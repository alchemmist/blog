server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  location ~* \.(woff2|png|jpe?g|webp|svg|ico|mp4|gif)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~* \.js$ {
    add_header Cache-Control "public, max-age=180000";
    try_files $uri =404;
  }
  location ~* \.css$ {
    add_header Cache-Control "public, max-age=1200";
    try_files $uri =404;
  }
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=100";
    try_files $uri =404;
  }

  location = /rss { return 302 /index.xml; }
  location = /feed { return 302 /index.xml; }
  location = /ru { return 301 /; }
  location = /ru/ { return 301 /; }

  location / {
    try_files $uri $uri/ =404;
  }
}
