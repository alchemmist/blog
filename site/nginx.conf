server {
  listen 8080;
  server_name _;
  # TLS terminates at the ingress. Never expose this server's HTTP/8080
  # origin in directory-slash redirects; the browser keeps its public origin.
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  location ~* \.(woff2|png|jpe?g|webp|svg|ico|mp4|gif)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~* \.js$ {
    add_header Cache-Control "public, max-age=180000";
    try_files $uri =404;
  }
  location ~* \.css$ {
    add_header Cache-Control "public, max-age=1200";
    try_files $uri =404;
  }
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=100";
    try_files $uri =404;
  }

  location = /rss { return 302 /index.xml; }
  location = /feed { return 302 /index.xml; }
  location = /ru { return 301 /; }
  location = /ru/ { return 301 /; }

  # Resume PDFs live on GitHub Pages. The CV page links these paths.
  location = /cv/en/long { return 302 https://alchemmist.github.io/CV/pdf/long-eng.pdf; }
  location = /cv/en/long/ { return 302 https://alchemmist.github.io/CV/pdf/long-eng.pdf; }
  location = /cv/en/go { return 302 https://alchemmist.github.io/CV/pdf/go-eng.pdf; }
  location = /cv/en/go/ { return 302 https://alchemmist.github.io/CV/pdf/go-eng.pdf; }
  location = /cv/en/python { return 302 https://alchemmist.github.io/CV/pdf/python-eng.pdf; }
  location = /cv/en/python/ { return 302 https://alchemmist.github.io/CV/pdf/python-eng.pdf; }
  location = /cv/ru/long { return 302 https://alchemmist.github.io/CV/pdf/long-rus.pdf; }
  location = /cv/ru/long/ { return 302 https://alchemmist.github.io/CV/pdf/long-rus.pdf; }
  location = /cv/ru/short { return 302 https://alchemmist.github.io/CV/pdf/short-rus.pdf; }
  location = /cv/ru/short/ { return 302 https://alchemmist.github.io/CV/pdf/short-rus.pdf; }
  location = /cv/ru/yandex { return 302 https://alchemmist.github.io/CV/pdf/short-yandex.pdf; }
  location = /cv/ru/yandex/ { return 302 https://alchemmist.github.io/CV/pdf/short-yandex.pdf; }
  location = /cv/ru/go { return 302 https://alchemmist.github.io/CV/pdf/go-rus.pdf; }
  location = /cv/ru/go/ { return 302 https://alchemmist.github.io/CV/pdf/go-rus.pdf; }
  location = /cv/ru/python { return 302 https://alchemmist.github.io/CV/pdf/python-rus.pdf; }
  location = /cv/ru/python/ { return 302 https://alchemmist.github.io/CV/pdf/python-rus.pdf; }
  location = /cv/ru/devops { return 302 https://alchemmist.github.io/CV/pdf/devops-rus.pdf; }
  location = /cv/ru/devops/ { return 302 https://alchemmist.github.io/CV/pdf/devops-rus.pdf; }

  location / {
    try_files $uri $uri/ =404;
  }
}
